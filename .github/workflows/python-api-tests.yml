name: Python API Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    name: pytest 接口自动化测试
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: campus_activity
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: mvn -B -f backend/pom.xml -DskipTests package

      - name: Initialize database
        run: |
          mysql --default-character-set=utf8mb4 -h 127.0.0.1 -P 3306 -uroot -p123456 \
            < database/campus_activity.sql

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        working-directory: python-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # conftest.py 会自动启动 backend/target 下的 jar（随机空闲端口），无需手动起服务
      - name: Run pytest
        working-directory: python-tests
        run: python -m pytest --html=reports/report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: python-tests/reports/
          retention-days: 14
