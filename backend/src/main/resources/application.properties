# ===== 服务端口 =====
server.port=${SERVER_PORT:8080}

# ===== 数据库连接 =====
# 默认使用 root / 123456 连接本机 MySQL；可用环境变量 DB_PASSWORD、DB_USERNAME 覆盖，
# 而不必修改本文件后重新提交。
spring.datasource.url=jdbc:mysql://localhost:3306/campus_activity?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池：避免 MySQL 未启动时长时间卡住，并给出明确的超时错误
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# ===== MyBatis =====
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.campus.entity
mybatis.configuration.map-underscore-to-camel-case=true

# ===== Jackson =====
spring.jackson.time-zone=Asia/Shanghai

# ===== 日志 =====
logging.level.com.campus=info
